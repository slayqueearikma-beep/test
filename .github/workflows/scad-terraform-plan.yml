name: SCAD Terraform Plan

on:
  pull_request:
    paths:
      - infrastructure/terraform/**
      - .github/workflows/scad-terraform-plan.yml
      - .github/workflows/reusable-deploy-azure.yml

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_DIR: infrastructure/terraform

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -no-color -input=false \
            -var="image_tag=plan-${{ github.sha }}" \
            -var="environment=staging" \
            | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const plan = fs.readFileSync('infrastructure/terraform/plan.txt', 'utf8');
            const body = [
              '## SCAD Terraform Plan',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan.length > 60000 ? plan.slice(0, 60000) + '\n...truncated...' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
