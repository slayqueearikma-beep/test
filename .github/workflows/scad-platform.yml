name: SCAD Platform Pipeline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: Container image tag to deploy
        required: false
        default: ""
      deploy_production:
        description: Deploy to production after staging
        required: false
        type: boolean
        default: false

concurrency:
  group: scad-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write
  attestations: write
  pull-requests: write

env:
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  validate:
    name: CI - Validate
    uses: ./.github/workflows/reusable-validate-app.yml

  security:
    name: CI - Security
    uses: ./.github/workflows/reusable-security-scan.yml

  build-supply-chain:
    name: CI - Build and Supply Chain
    needs:
      - validate
      - security
    uses: ./.github/workflows/reusable-build-supply-chain.yml
    with:
      image_tag: ${{ env.IMAGE_TAG }}

  risk-gate:
    name: CI - Risk Gate
    needs:
      - validate
      - security
      - build-supply-chain
    uses: ./.github/workflows/reusable-risk-gate.yml
    with:
      findings_artifact: pipeline-security-findings-${{ github.run_id }}
      minimum_score: 60

  publish-observability:
    name: Observability - Publish Metrics
    runs-on: ubuntu-latest
    needs:
      - risk-gate
    if: always() && vars.SCAD_FINOPS_STORAGE_ACCOUNT != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download pipeline findings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pipeline-security-findings-${{ github.run_id }}
          path: pipeline-artifacts

      - name: Publish pipeline metrics JSON
        env:
          SCAD_FINOPS_STORAGE_ACCOUNT: ${{ vars.SCAD_FINOPS_STORAGE_ACCOUNT }}
          PIPELINE_FINDINGS_FILE: pipeline-artifacts/pipeline-findings.json
          DEPLOYMENT_ENVIRONMENT: ci
          PIPELINE_CONCLUSION: ${{ needs.risk-gate.result }}
        run: node scripts/publish-pipeline-metrics.mjs

  deploy-staging:
    name: CD - Staging
    needs:
      - build-supply-chain
      - risk-gate
    if: >
      needs.risk-gate.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      image_tag: ${{ env.IMAGE_TAG }}
      environment_name: staging
      terraform_environment: staging
      state_cache_key: ${{ github.repository }}-staging
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy-production:
    name: CD - Production
    needs:
      - deploy-staging
    if: >
      needs.deploy-staging.result == 'success' &&
      (
        inputs.deploy_production == true ||
        startsWith(github.ref, 'refs/tags/v')
      )
    uses: ./.github/workflows/reusable-deploy-azure.yml
    with:
      image_tag: ${{ env.IMAGE_TAG }}
      environment_name: production
      terraform_environment: production
      state_cache_key: ${{ github.repository }}-production
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
