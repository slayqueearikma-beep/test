name: Reusable - Validate Application

on:
  workflow_call:
    outputs:
      coverage_percent:
        description: Line coverage percentage
        value: ${{ jobs.validate.outputs.coverage_percent }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    outputs:
      coverage_percent: ${{ steps.coverage.outputs.coverage_percent }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        id: coverage
        run: |
          npm run test:coverage
          COVERAGE="$(node -e "const s=require('./coverage/coverage-summary.json'); console.log(s.total.lines.pct)")"
          echo "coverage_percent=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Line coverage: ${COVERAGE}%"

      - name: Enforce coverage threshold
        run: npm run test:coverage:check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_id }}
          path: app/coverage/
          retention-days: 14
