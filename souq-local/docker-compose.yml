services:
  postgres:
    image: postgres:16-alpine
    container_name: souq-local-db
    environment:
      POSTGRES_USER: souq
      POSTGRES_PASSWORD: souq_local_dev
      POSTGRES_DB: souq_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souq -d souq_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
