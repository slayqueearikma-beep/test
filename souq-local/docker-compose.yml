services:
  postgres:
    image: postgres:16-alpine
    container_name: margem-db
    environment:
      POSTGRES_USER: souq
      POSTGRES_PASSWORD: souq_local_dev
      POSTGRES_DB: souq_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souq -d souq_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: margem-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://souq:souq_local_dev@postgres:5432/souq_local
      JWT_SECRET_KEY: local-dev-secret-change-in-production
      AUTH_DEV_BYPASS: "false"
      CORS_ORIGINS: '["*"]'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "PYTHONPATH=/app python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
