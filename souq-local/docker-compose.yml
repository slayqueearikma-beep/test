services:
  postgres:
    image: postgres:16-alpine
    container_name: margem-db
    environment:
      POSTGRES_USER: souq
      POSTGRES_PASSWORD: souq_local_dev
      POSTGRES_DB: souq_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souq -d souq_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: margem-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://souq:souq_local_dev@postgres:5432/souq_local
      JWT_SECRET_KEY: local-dev-secret-change-in-production-min-32-chars
      UPLOAD_TOKEN_SECRET: local-dev-upload-token-secret-change-in-production-min-32-chars
      AUTH_DEV_BYPASS: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://10.0.2.2:8000"]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
