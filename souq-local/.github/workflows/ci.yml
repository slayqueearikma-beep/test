name: MarGem CI

on:
  push:
    paths:
      - "souq-local/**"
  pull_request:
    paths:
      - "souq-local/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: souq
          POSTGRES_PASSWORD: souq_local_dev
          POSTGRES_DB: souq_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U souq -d souq_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: souq-local/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://souq:souq_local_dev@localhost:5432/souq_local
          JWT_SECRET_KEY: test-jwt-secret-key-minimum-32-characters-long

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: souq-local/infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: souq-local/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
