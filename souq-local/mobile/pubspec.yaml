name: souq_local
description: MarGem — discover Morocco's hidden gems. Local business marketplace mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_maps_flutter: ^2.10.0
  http: ^1.2.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  flutter_rating_bar: ^4.0.1
  geolocator: ^13.0.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
